<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F3EF; --surface:#FFFFFF; --surface2:#ECECE6; --line:#DCDBD3; --fg:#1D2125; --muted:#5B6066;
  --gold:#E3A50B; --gold-ink:#7A5200; --gold-soft:#FFF1CC; --ink:#22272C; --on-ink:#FFFFFF;
  --ok:#17704A; --ok-soft:#E1F3E9; --warn:#8A5300; --warn-soft:#FFEFC9; --bad:#AE3410; --bad-soft:#FBE3D8;
  --info:#1F5FA8; --info-soft:#E2EDFA; --sel:#D6E6FA; --mute-soft:#E9E9E3;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
h1,h2,h3{margin:0}
.tab{font-variant-numeric:tabular-nums}
.sr{position:absolute;left:-9999px}
.app{max-width:1320px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.app.m{max-width:460px;border-inline:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
.app.m .top{padding:10px 12px}
.ttl{display:flex;align-items:center;gap:8px;min-width:0}
.ttl small{display:block;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl h1{font-size:19px;white-space:nowrap}
.app.m .ttl h1{font-size:16px}
.iconbtn{width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.right{display:flex;align-items:center;gap:8px}
.who{font-size:12px;color:var(--muted);white-space:nowrap}
.content{flex:1;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.app.m .content{padding:14px;gap:12px}
.foot{padding:10px 20px 70px;font-size:11px;color:var(--muted);text-align:right}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.app.m .g2,.app.m .g3{grid-template-columns:minmax(0,1fr)}
.app.m .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.app.m .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-size:16px}
.panel h3{font-size:14px}
.sub{font-size:12px;color:var(--muted)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.app.m .stat{padding:8px 10px}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.stat b{font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.app.m .stat b{font-size:20px}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--ink)}
button.stat.on{box-shadow:inset 0 0 0 2px var(--ink)}
.stat.bad{background:var(--bad-soft);border-color:transparent}.stat.bad span,.stat.bad b{color:var(--bad)}
.stat.gold{background:var(--gold-soft);border-color:transparent}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:#1D2125;border-color:var(--gold)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:12px}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.del{width:30px;height:30px;border:none;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;border-radius:7px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:none;background:none;padding:10px 14px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--gold)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap;border:none}
button.pill{cursor:pointer;min-height:28px}
.p-gray{background:var(--mute-soft);color:var(--muted)}.p-info{background:var(--info-soft);color:var(--info)}.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-gold{background:var(--gold-soft);color:var(--gold-ink)}
select.pill{border:none;padding-right:4px;cursor:pointer;min-height:28px}
.name{display:inline-flex;font-size:12px;font-weight:700;background:var(--surface2);border-radius:6px;padding:1px 8px;white-space:nowrap}
.pjcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px;text-align:left;cursor:pointer;width:100%}
.pjcard:hover{border-color:var(--gold)}
.pjcard .nm{font-size:18px;font-weight:700}
.pjcard .days{font-size:28px;font-weight:700;line-height:1}
.tile{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;text-align:center;padding:6px}
.tile.x{color:var(--muted);border-style:dashed;cursor:default}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:none}
.li .grow{flex:1;min-width:140px;display:flex;flex-direction:column}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:calc(100vh - 150px)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.t th{background:var(--surface2);text-align:left;font-size:12px;color:var(--muted);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.t td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle;background:var(--surface)}
.t tr.grp td{background:var(--gold-soft);font-weight:700;padding:7px 10px}
.t tr.mine td.rh{box-shadow:inset 3px 0 0 var(--gold)}
.t tr.done td{color:var(--muted)}
.t tr.now td{background:var(--gold-soft)}
.t th[data-colh]{cursor:pointer;user-select:none}
.t th[data-colh]:hover{color:var(--fg)}
.t .rh{width:42px;min-width:42px;text-align:center;color:var(--muted);font-size:11px;cursor:pointer;user-select:none;padding:4px 2px;font-variant-numeric:tabular-nums}
.t td.rh:hover{background:var(--surface2);color:var(--fg)}
.t tr.selrow td{background:var(--sel)}
.t td.selcol,.t th.selcol{background:var(--sel)}
.t tr.selrow td.rh{background:var(--info);color:#fff}
.t th.selcol{color:var(--info)}
.sortmark{font-size:10px;color:var(--info);margin-left:3px}
.cell{width:100%;min-width:56px;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--info);background:var(--surface);outline:none;box-shadow:0 0 0 2px var(--info-soft)}
.box{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-weight:400;font-size:14px;color:var(--fg);min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.mine{border-color:var(--gold)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grphead{font-size:12px;font-weight:700;color:var(--gold-ink);display:flex;justify-content:space-between;align-items:center;padding:6px 2px 0}
.warnbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.callout{border:1px dashed var(--gold-ink);background:var(--gold-soft);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7}
.check{min-width:64px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.check.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.login{max-width:400px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
.login h2{font-size:22px}
.login input{font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.login .btn{min-height:48px;font-size:15px}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(70px,170px) minmax(0,1fr) 78px;gap:8px;align-items:center;font-size:13px}
.hbar .tr{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--gold)}
.hbar .n{text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.kwmap{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;line-height:1.3}
.kw{border:none;background:none;cursor:pointer;font-weight:700;padding:2px 4px;border-radius:6px}
.kw.pos{color:var(--ok)}.kw.neg{color:var(--bad)}.kw.sel{background:var(--gold-soft)}
.quote{font-size:13px;padding:8px 12px;border-left:3px solid var(--line);background:var(--surface2);border-radius:0 8px 8px 0}
.tt-layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}
.app.m .tt-layout{grid-template-columns:minmax(0,1fr)}
.tt-preview{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#E9E8E2;padding:14px;max-height:calc(100vh - 160px)}
.tt-side{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 160px);overflow:auto}
.app.m .tt-preview,.app.m .tt-side{max-height:none}
.blk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.blk.sel{border-color:var(--info);box-shadow:0 0 0 2px var(--info-soft)}
.blk textarea{grid-column:1/-1;min-height:38px;resize:vertical}
.blk input,.blk select,.blk textarea{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:var(--surface);min-width:0}
.blk label{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.mini{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px auto;gap:6px;align-items:center}
.mini input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;min-width:0}
.flowt{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;min-width:56px}
/* 列幅のドラッグ */
.t th{position:sticky}
.rz{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:3;touch-action:none}
.rz::after{content:"";position:absolute;top:20%;bottom:20%;left:4px;width:2px;border-radius:1px;background:transparent}
.t th:hover .rz::after{background:#B9B8AF}
.rz:hover::after,.rz.on::after{background:var(--info)!important;top:0;bottom:0}
table.t.fixed{table-layout:fixed}
.t.fixed th{overflow:hidden;text-overflow:ellipsis}
.t.fixed td{overflow:hidden;overflow-wrap:anywhere}
.t.fixed .cell{min-width:0!important;width:100%!important}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}
/* 読み込み・保存の表示 */
.netbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:50;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent 0,var(--gold) 30%,var(--gold) 50%,transparent 80%);background-size:200% 100%;animation:net 1.1s linear infinite}
.netbar.on{opacity:1}
@keyframes net{from{background-position:100% 0}to{background-position:-100% 0}}
.st{flex:1;display:flex;justify-content:center;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:999px;padding:4px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip small{font-weight:400}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.stwrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.app.m .chip small{display:none}
.skel{gap:12px}
.skel i{display:block;height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface2) 0,#F6F6F2 50%,var(--surface2) 100%);background-size:200% 100%;animation:net 1.4s linear infinite}
.skel .lbl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
/* 一括操作バー・メニュー・お知らせ */
.bulk{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
.bulk b{font-size:13px;padding:0 6px}
.bulk select,.bulk input{border:none;border-radius:7px;padding:5px 8px;font-size:12px;color:var(--fg);background:#fff;min-width:0}
.bulk .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.bulk .btn:hover{background:rgba(255,255,255,.12)}
.bulk .btn.danger{background:var(--bad);border-color:var(--bad)}
.ctx{position:fixed;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:220px;max-height:70vh;overflow:auto}
.ctx button{display:flex;justify-content:space-between;gap:16px;width:100%;border:none;background:none;text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.ctx button:hover,.ctx button:focus{background:var(--surface2);outline:none}
.ctx button.danger{color:var(--bad)}
.ctx button kbd{font:inherit;font-size:11px;color:var(--muted)}
.ctx .cap{font-size:11px;color:var(--muted);font-weight:700;padding:6px 10px 2px}
.ctx hr{border:none;border-top:1px solid var(--line);margin:4px 2px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 12px 10px 16px;border-radius:10px;font-size:13px;z-index:30;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:7px;padding:4px 10px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
body.hasbulk .toast{bottom:76px}
.toast[hidden],.netbar[hidden]{display:none}
/* スワイプ */
.sw{position:relative;border-radius:10px;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sw .card{position:relative;z-index:1;transition:transform .2s}
.sw.dragging .card{transition:none}
.sw-bg{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;font-size:13px;color:#fff;opacity:0}
.sw.r .sw-bg{opacity:1;background:var(--ok)}
.sw.l .sw-bg{opacity:1;background:var(--bad)}
.sw.r .sw-bg .lt,.sw.l .sw-bg .rt{visibility:hidden}
.sw.arm .sw-bg{filter:brightness(1.1)}
.swhint{font-size:11px;color:var(--muted);text-align:center}
@keyframes fresh{0%{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}100%{background:var(--surface);box-shadow:0 0 0 0 transparent}}
.t tr.fresh td{animation:fresh 1.6s ease-out}
.sw.fresh .card,.panel.fresh{animation:fresh 1.6s ease-out}
</style>
</head>
<body>
<!-- Apps Script から開いたときは、ここにサイトのURLと受付リンクの合言葉が自動で入ります -->
<div id="cfg" data-api="<?= apiUrl ?>" data-guest="<?= guestKey ?>" hidden></div>
<div id="netbar" class="netbar"></div>
<div id="root"></div>
<div id="ctxwrap"></div>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
"use strict";
/* ほかのサーバー（GitHub Pagesなど）にこのファイルを置くときだけ、下の '' の中に
   ウェブアプリのURL（https://script.google.com/macros/s/…/exec）を貼ってください */
var API_URL_HOSTED = '';
var APP_VERSION = '2026.11.09';   // サーバー（コード.gs）の APP_VERSION と同じにする

var PAGES = ['ホーム','ToDo','集客アタック','メンバー表','アンケート分析','備品表','制作物・図面','資料','タイムテーブル','権限・連携'];
var PAGE_VIEW = {'ToDo':'todo','集客アタック':'attack','メンバー表':'members','アンケート分析':'analysis','備品表':'equip','制作物・図面':'works','資料':'docs','タイムテーブル':'timetable','権限・連携':'settings'};
var VIEW_TITLE = {home:'ホーム',todo:'ToDo',attack:'集客アタック',members:'メンバー表',analysis:'アンケート分析',equip:'備品表',works:'制作物・図面',docs:'資料',timetable:'タイムテーブル',settings:'権限・連携'};
var PARTS = {home:['todo','atk'],todo:['todo'],attack:['atk'],members:['guest','staff','share'],equip:['equip'],works:['work'],docs:['doc'],timetable:['ttcfg','block','flow']};
var ALL_PARTS = ['todo','atk','guest','staff','share','equip','work','doc','ttcfg','block','flow'];
var POLL_MS = 30000;
var CFG = document.getElementById('cfg');
var cfgApi = CFG ? (CFG.getAttribute('data-api') || '') : '';
var API = /^https:\/\//.test(cfgApi) ? cfgApi : API_URL_HOSTED;
var cfgGuest = CFG ? (CFG.getAttribute('data-guest') || '') : '';
var GUEST = /^[0-9a-zA-Z]{8,}$/.test(cfgGuest) ? cfgGuest : ((location.search.match(/[?&]guest=([0-9a-zA-Z]+)/) || [])[1] || '');

/* ========== 小道具 ========== */
function load(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function store(k, v){ try { if(v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch(e){} }
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function errMsg(e){ return String((e && e.message) || e || '').replace(/^Error:\s*/, '').replace(/^Exception:\s*/, ''); }

  var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return null;
  var t = todayStr().split('-').map(Number);
  return Math.round((Date.UTC(+m[1], +m[2]-1, +m[3]) - Date.UTC(t[0], t[1]-1, t[2])) / 86400000);
}

/* いろいろな書き方の日付を 2026-11-03 にそろえる（サーバーと同じ考え方） */
function normDate(v){
  var s = String(v == null ? '' : v).trim(); if(!s) return '';
  var m = s.match(/^(\d{4})\s*[-\/.年]\s*(\d{1,2})\s*[-\/.月]\s*(\d{1,2})/);
  if(m) return m[1] + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0');
  m = s.match(/^(\d{1,2})\s*[\/月]\s*(\d{1,2})\s*日?\s*(?:[(（].*)?$/);
  if(m){
    var t = todayStr().split('-').map(Number), y = t[0];
    if((Date.UTC(y, +m[1]-1, +m[2]) - Date.UTC(t[0], t[1]-1, t[2])) / 86400000 < -180) y++;
    return y + '-' + String(m[1]).padStart(2,'0') + '-' + String(m[2]).padStart(2,'0');
  }
  return s;
}

function newRow(key, init){

    todo:{ status:'未着手', who:nm },

    guest:{ status:'参加', src:'当日追加' },

/* 貼り付けた文字を、その列にふさわしい値にする（だめなら undefined） */
function normVal(key, f, v){
  var m = META[key] || {}; v = String(v == null ? '' : v).replace(/\r/g, '').trim();
  if(f.charAt(0) === '#') return undefined;
  if((m.dates || []).indexOf(f) >= 0) return normDate(v);
  if((m.times || []).indexOf(f) >= 0){ var t = v.match(/^(\d{1,2})[:：](\d{2})/); return t ? String(t[1]).padStart(2,'0') + ':' + t[2] : (v ? undefined : ''); }

  if(f === 'inC' || f === 'outC') return /^(TRUE|済|○|◯|✓|✔|1|はい|yes)$/i.test(v);
  if(f === 'recv') return /^(TRUE|済|受付済|○|◯|✓|✔|1|はい|yes)$/i.test(v) ? '済' : '';

  else v = r[f];

/* Excel・スプレッドシートからコピーした表（タブ区切り）を2次元配列にする */
function parseTSV(text){
  text = String(text).replace(/\r\n?/g, '\n').replace(/\n$/, '');
  var rows = [], row = [], cell = '', q = false;
  for(var i = 0; i < text.length; i++){
    var c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c === '"' && cell === '') q = true;
    else if(c === '\t'){ row.push(cell); cell = ''; }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows;
}

/* ========== 通信（読み込み中・保存中の表示つき） ========== */
var NET = 0;
function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  NET++; updateStatus();
  var done = function(){ NET = Math.max(0, NET - 1); updateStatus(); };
  return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function(r){ if(!r.ok) throw new Error('通信エラー（' + r.status + '）。少し待ってからもう一度お試しください。'); return r.text(); })
    .then(function(text){
      var j; try { j = JSON.parse(text); } catch(e){ throw new Error('サイトの公開設定を確認してください（アクセスできるユーザー：全員）。'); }
      if(!j.ok){ if(/不明な操作です/.test(j.error)){ S.svBad = 'server'; scheduleRender(); } throw new Error(j.error); }
      return checkSv(j.result);
    }, function(e){ if(e instanceof TypeError) throw new Error('インターネットにつながっていないか、サーバーに届きませんでした。'); throw e; })
    .then(function(r){ done(); return r; }, function(e){ done(); throw e; });
}

var Q = [], QRUN = false, TMPN = 0, TMPMAP = {}, REV = {}, FRESH = {};
function isFresh(id){ return !!(FRESH[id] || (REV[id] && FRESH[REV[id]])); }
function realId(id){ return TMPMAP[id] || id; }
function fieldsOf(it){ var o = {}; Object.keys(it).forEach(function(k){ if(k !== 'id' && k !== 'tmp') o[k] = it[k]; }); return o; }
function applyOp(op){
  if(!S.data) return;
  var arr = (S.data.parts[op.key] || []).slice();
  if(op.kind === 'del'){
    var gone = {}; op.ids.forEach(function(id){ gone[id] = 1; gone[realId(id)] = 1; });
    S.data.parts[op.key] = arr.filter(function(r){ return !gone[r.id]; });
    return;
  }
  op.items.forEach(function(it){
    var id = it.id ? realId(it.id) : it.tmp, at = -1;
    for(var i = 0; i < arr.length; i++){ if(arr[i].id === id || (it.tmp && arr[i].id === realId(it.tmp))){ at = i; break; } }
    if(at >= 0) arr[at] = Object.assign({}, arr[at], fieldsOf(it));
    else if(!it.id) arr.push(newRow(op.key, Object.assign(fieldsOf(it), { id: it.tmp })));
  });
  S.data.parts[op.key] = arr;
}
function enqueue(op){
  op.pj = S.pjId;
  Q.push(op); applyOp(op); savePjCache();
  if(op.kind === 'save' && op.items.every(function(it){ return it.id; }) && S.view !== 'home'){
    if(quickRows(op.key, op.items.map(function(it){ return realId(it.id); }))) idleRender(); else scheduleRender();
  } else if(op.kind === 'save' && op.items.every(function(it){ return !it.id; }) && op.items.length <= 5 && quickInsert(op.key, op.items.map(function(it){ return it.tmp; }))){
    idleRender();
  } else if(op.kind === 'del' && S.view !== 'home'){
    op.ids.forEach(function(id){ var rid = realId(id); document.querySelectorAll('tr[data-row="' + rid + '"][data-k="' + op.key + '"], .sw[data-sk="' + op.key + '"][data-sid="' + rid + '"], [data-row="' + rid + '"][data-k="' + op.key + '"]').forEach(function(n){ n.remove(); }); });
    renumber(); idleRender();
  } else scheduleRender();
  updateStatus(); pump();
}
function mergeOps(a, b){
  var map = {}, out = [];
  a.items.concat(b.items).forEach(function(it){
    var k = it.id ? realId(it.id) : it.tmp;
    if(map[k]) Object.assign(map[k], fieldsOf(it));
    else { var c = Object.assign({}, it); map[k] = c; out.push(c); }
  });
  return { kind:'save', key:a.key, items:out, pj:a.pj };

function pump(){

  }
  QRUN = true; updateStatus();
  var req;
  if(op.kind === 'save'){
    var payload = op.items.map(function(it){ var o = fieldsOf(it); if(it.id) o.id = realId(it.id); return o; });
    req = call('saveRows', S.token, op.pj, op.key, payload, !op.dupCheck);
  } else {
    var ids = op.ids.map(realId).filter(function(id){ return id && !/^tmp/.test(id); });

    req = call('deleteRows', S.token, op.pj, op.key, ids);

    QRUN = false; Q.shift();
    if(op.pj !== S.pjId || !S.data){ pump(); return; }
    if(res.dup){
      S.data.parts[op.key] = P(op.key).filter(function(r){ return r.id !== op.items[0].tmp; });
      S.dup = { name: res.dup.name, hits: res.dup.hits, item: fieldsOf(op.items[0]) };
      S.undo = S.undo.filter(function(u){ return !(u.kind === 'add' && u.ids.indexOf(op.items[0].tmp) >= 0); });
    } else {
      if(op.kind === 'save') op.items.forEach(function(it, i){
        if(it.id || !it.tmp) return;
        var rid = res.ids[i]; TMPMAP[it.tmp] = rid; REV[rid] = it.tmp;
        ['data-row','data-sid','data-id','data-v','data-rh'].forEach(function(a){ document.querySelectorAll('[' + a + '="' + it.tmp + '"]').forEach(function(n){ n.setAttribute(a, rid); }); });
        var blk = document.getElementById('blk-' + it.tmp); if(blk) blk.id = 'blk-' + rid;
      });
      S.data.parts[op.key] = res.rows;
      S.partVer[op.key] = res.ver; S.ver = res.ver; S.lastAt = res.at;
      Q.forEach(function(o){ if(o.key === op.key && o.pj === S.pjId) applyOp(o); });
      S.savedAt = Date.now();
      S.gsel.ids = S.gsel.ids.map(realId);

/* 変更・追加・削除（どれも「元に戻す」できる） */
function patch(key, items, label, noUndo){

  var before = items.map(function(it){
    var r = rowOf(key, realId(it.id)) || {}, b = { id: it.id };
    Object.keys(fieldsOf(it)).forEach(function(f){ b[f] = r[f] === undefined ? '' : r[f]; });
    return b;
  });
  var u = { kind:'patch', key:key, items:before, label:label || '変更' };
  if(!noUndo) pushUndo(u);
  enqueue({ kind:'save', key:key, items: items.map(function(it){ return Object.assign({}, it); }) });
  return u;
}
function addRows(key, inits, label, opt){
  if(!inits.length) return null;
  var items = inits.map(function(o){ return Object.assign({}, o, { tmp: 'tmp' + (++TMPN) }); });
  items.forEach(function(i){ FRESH[i.tmp] = true; });
  var u = { kind:'add', key:key, ids: items.map(function(i){ return i.tmp; }), label: label || '追加' };
  if(!(opt && opt.noUndo)) pushUndo(u);
  enqueue({ kind:'save', key:key, items:items, dupCheck: !!(opt && opt.dupCheck) });
  if(!(opt && opt.noReveal) && items.length <= 3) reveal(key, items[items.length - 1].tmp, opt && opt.focus);

}
/* 追加した行を画面に入れる（必要ならスクロール）。focus に列名を渡すとその欄にカーソル */
function reveal(key, id, focusField){

    var el = document.querySelector('tr[data-row="' + id + '"][data-k="' + key + '"], .sw[data-sk="' + key + '"][data-sid="' + id + '"], [data-row="' + id + '"][data-k="' + key + '"]');
    if(!el) return false;

    if(r.top < Math.max(wb.top, 70) || r.bottom > Math.min(wb.bottom, window.innerHeight)) el.scrollIntoView({ block:'center' });
    if(focusField && !isM()){ var f = el.querySelector('[data-f="' + focusField + '"]'); if(f) f.focus({ preventScroll:true }); }
    return true;
  };
  if(!go()) setTimeout(go, 30);
}
function delRows(key, ids, label, opt){
  var rows = ids.map(function(id){ return rowOf(key, realId(id)); }).filter(Boolean).map(clone);
  if(!rows.length) return null;

  if(!(opt && opt.noUndo)) pushUndo(u);

}

/* ========== ToDo ========== */
function stMatch(t){
  var f = S.todoStatus, n = daysLeft(t.end);
  if(f === 'すべて') return true;
  if(f === '未完了') return t.status !== '完了';
  if(f === '期限切れ') return t.status !== '完了' && n !== null && n < 0;
  if(f === '7日以内') return t.status !== '完了' && n !== null && n >= 0 && n <= 7;
  return t.status === f;
}

function ttLayout(c){
  var titleH = 40, headH = 24, timeW = 52;
  var x = [timeW]; c.cols.forEach(function(col, i){ x.push(x[i] + (Number(col.w)||80)); });
  var s = toMin(c.start), e = Math.max(toMin(c.end), s + 60);

}
function colIdx(c, n){ var i = c.cols.findIndex(function(col, k){ return (col.order || k+1) === Number(n); }); return i >= 0 ? i : Math.max(0, Math.min(c.cols.length - 1, (Number(n)||1) - 1)); }
function blockRect(c, L, b){
  var c1 = colIdx(c, b.c1), c2 = Math.max(c1, colIdx(c, b.c2 || b.c1));

}

    addRows('guest', [{ name:gn, univ:val('gUniv'), grade:val('gGrade'), status:'参加', recv:'済', src:'当日追加' }], '当日参加の追加');
    toast(gn + 'さんを当日参加で受付しました', { action:'元に戻す', fn: undo });
    ['gName','gUniv','gGrade'].forEach(function(i){ var x = document.getElementById(i); if(x) x.value = ''; });
    var g1 = document.getElementById('gName'); if(g1) g1.focus({ preventScroll:true });
  } else if(kind === 'guestNew'){
    var gn2 = val('gnName'); if(!gn2) return toast('氏名を入力してください');
    S.filter.guest = ''; S.search.guest = '';
    guestSave({ name:gn2, univ:val('gnUniv'), grade:val('gnGrade') }, gn2 + 'さんを当日参加で受付しました');
    ['gnName','gnUniv','gnGrade'].forEach(function(i){ var x = document.getElementById(i); if(x) x.value = ''; });
  } else if(kind === 'pjinfo'){ adm('saveProjectInfo', fd); }
  else if(kind === 'member'){ if(!fd.email) return toast('追加する人を選んでください'); adm('savePjMember', fd.email, fd.role); }
  else if(kind === 'user'){ adm('saveUser', { email:fd.email, last:fd.last, first:fd.first, kind:fd.kind, active:'有効' }); }
  else if(kind === 'tools'){ adm('saveTools', { design:{ name:fd.design_name, url:fd.design_url }, submit:{ name:fd.submit_name, url:fd.submit_url }, drawing:{ name:fd.drawing_name, url:fd.drawing_url } }); }
  else if(kind === 'newpj'){
    setLoad('プロジェクトを作っています…');
    call('createProject', S.token, S.pjId, fd).then(function(r){ setLoad(null); toast('プロジェクトを作成しました'); openPj(r.newId); }).catch(fail);
  }
});

/* ---- キーボード（スプレッドシートと同じ感覚で） ---- */
function isTextInput(el){ return el.tagName === 'INPUT' && /^(text|search|url|email|)$/.test(el.type || ''); }
function moveVert(el, dir){
  var tr = el.closest('tr[data-row]'); if(!tr) return false;
  var key = el.getAttribute('data-t'), f = el.getAttribute('data-f'), vis = S.vis[key] || [];
  var i = vis.indexOf(tr.getAttribute('data-row')), nx = vis[i + dir]; if(!nx) return false;
  var t = document.querySelector('[data-t="' + key + '"][data-f="' + f + '"][data-id="' + nx + '"]'); if(!t) return false;
  t.focus(); if(t.select && isTextInput(t)) t.select();
  return true;
}
document.addEventListener('keydown', function(e){
  if(e.isComposing || e.keyCode === 229) return;
  var el = e.target, inField = /INPUT|SELECT|TEXTAREA/.test(el.tagName) && el.type !== 'checkbox', mod = e.ctrlKey || e.metaKey;
  if(S.ctx){
    if(e.key === 'Escape'){ e.preventDefault(); closeCtx(); return; }
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); var bs = Array.prototype.slice.call(document.querySelectorAll('.ctx button')), at = bs.indexOf(document.activeElement); var nb = bs[(at + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length]; if(nb) nb.focus(); return; }
    return;
  }
  if(e.key === 'Escape'){
    if(inField && el.hasAttribute('data-t')){ var r = rowOf(el.getAttribute('data-t'), realId(el.getAttribute('data-id'))); if(r && el.tagName !== 'SELECT'){ el.value = r[el.getAttribute('data-f')] == null ? '' : r[el.getAttribute('data-f')]; } DIRTY = null; el.blur(); return; }
    if(S.gsel.ids.length || S.gsel.col){ clearSel(); selPaint(); }
    return;
  }
  if(inField){
    if(!el.hasAttribute('data-t') || !el.closest('tr[data-row]') || el.tagName === 'TEXTAREA') return;
    if(e.key === 'Enter' && !mod){ e.preventDefault(); if(!moveVert(el, e.shiftKey ? -1 : 1)) el.blur(); return; }
    if((e.key === 'ArrowDown' || e.key === 'ArrowUp') && isTextInput(el)){ e.preventDefault(); moveVert(el, e.key === 'ArrowUp' ? -1 : 1); }
    return;
  }
  if(mod && !e.shiftKey && (e.key === 'z' || e.key === 'Z')){ e.preventDefault(); undo(); return; }
  if(mod && (e.key === 'a' || e.key === 'A')){ var k = activeGridKey(); if(k){ e.preventDefault(); selectAll(k); } return; }
  if((e.key === 'Delete' || e.key === 'Backspace') && (S.gsel.ids.length || S.gsel.col)){ e.preventDefault(); deleteOrClear(); render(); return; }
  if((e.key === 'ArrowDown' || e.key === 'ArrowUp') && S.gsel.ids.length){
    var vis = S.vis[S.gsel.key] || [], cur = vis.indexOf(S.gsel.anchor), nx = vis[cur + (e.key === 'ArrowDown' ? 1 : -1)];
    if(nx){ e.preventDefault(); if(e.shiftKey){ var ids = S.gsel.ids.slice(); if(ids.indexOf(nx) < 0) ids.push(nx); selRows(S.gsel.key, ids, nx); S.gsel.anchor = nx; } else selRows(S.gsel.key, [nx], nx); }
  }
});
function inTextSelection(){
  var ae = document.activeElement;
  if(ae && /INPUT|TEXTAREA/.test(ae.tagName)){ try { return ae.selectionStart !== ae.selectionEnd; } catch(e){ return false; } }
  var s = window.getSelection && window.getSelection(); return !!(s && String(s).trim());
}
document.addEventListener('copy', function(e){
  if(inTextSelection() || editing()) return;
  var t = selectionTSV(); if(!t) return;
  e.clipboardData.setData('text/plain', t.text); e.preventDefault();
  toast(t.label + 'をコピーしました。スプレッドシートにもそのまま貼り付けられます。');
});
document.addEventListener('cut', function(e){
  if(inTextSelection() || editing()) return;
  var t = selectionTSV(); if(!t) return;
  e.clipboardData.setData('text/plain', t.text); e.preventDefault();
  deleteOrClear(); render();
});
document.addEventListener('paste', function(e){
  if(GUEST || !S.data) return;
  var text = (e.clipboardData || window.clipboardData).getData('text');
  if(!text) return;
  if(gridPaste(text, e.target)) e.preventDefault();
});

/* ---- スマホ：スワイプ・長押し・左端から戻る ---- */
var SW = null, EDGE = null;
document.addEventListener('touchstart', function(e){
  var t = e.touches[0]; if(!t || e.touches.length > 1){ SW = null; EDGE = null; return; }
  EDGE = (t.clientX < 24 && backTarget()) ? { x:t.clientX, y:t.clientY } : null;
  var w = e.target.closest('.sw');
  if(!w || e.target.closest('input,select,textarea,button,a')){ SW = null; return; }
  SW = { w:w, card: w.querySelector('.card'), x:t.clientX, y:t.clientY, dx:0, mode:'', key: w.getAttribute('data-sk'), id: w.getAttribute('data-sid') };
  SW.lp = setTimeout(function(){
    if(!SW || SW.mode || SW.key === 'glink') return;
    SW.mode = 'menu'; if(navigator.vibrate) navigator.vibrate(12);
    rowMenu(SW.key, SW.id, Math.min(t.clientX, window.innerWidth - 230), t.clientY);
  }, 520);
}, { passive:true });
document.addEventListener('touchmove', function(e){
  var t = e.touches[0]; if(!t) return;
  if(EDGE && (t.clientX - EDGE.x > 90) && Math.abs(t.clientY - EDGE.y) < 50){ var bt = backTarget(); EDGE = null; SW = null; if(bt) ACT.go(bt); return; }
  if(!SW) return;
  var dx = t.clientX - SW.x, dy = t.clientY - SW.y;
  if(!SW.mode){
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    clearTimeout(SW.lp);
    if(Math.abs(dx) > Math.abs(dy) * 1.3){ SW.mode = 'swipe'; SW.w.classList.add('dragging'); } else { SW = null; return; }
  }
  if(SW.mode !== 'swipe') return;
  if(SW.key === 'glink' && dx < 0) dx = 0;
  SW.dx = Math.max(-140, Math.min(140, dx));
  SW.card.style.transform = 'translateX(' + SW.dx + 'px)';
  SW.w.classList.toggle('r', SW.dx > 0); SW.w.classList.toggle('l', SW.dx < 0); SW.w.classList.toggle('arm', Math.abs(SW.dx) > 80);
}, { passive:true });
document.addEventListener('touchend', function(){
  EDGE = null;
  if(!SW) return;
  clearTimeout(SW.lp);
  var s = SW; SW = null;
  if(s.mode !== 'swipe') return;
  s.w.classList.remove('dragging'); s.card.style.transform = '';
  setTimeout(function(){ s.w.classList.remove('r','l','arm'); }, 200);
  if(s.dx > 80){
    if(s.key === 'glink'){ var g = S.guest.guests.filter(function(x){ return x.id === s.id; })[0]; if(g){ var on = g.recv !== '済'; guestSave(on ? { id:s.id, recv:true, status:'参加' } : { id:s.id, recv:false }, on ? g.name + 'さんを受付しました' : '受付を取り消しました'); } return; }
    var r = rowOf(s.key, s.id), ra = r && rightAction(s.key, r); if(ra) ra.run();
  } else if(s.dx < -80 && s.key !== 'glink'){
    var r2 = rowOf(s.key, s.id), m = META[s.key] || {}; delRows(s.key, [s.id], r2 && r2[m.name] ? '「' + r2[m.name] + '」' : '1行');
  }
});
document.addEventListener('touchcancel', function(){ if(SW){ clearTimeout(SW.lp); SW.card.style.transform = ''; SW.w.classList.remove('dragging','r','l','arm'); } SW = null; EDGE = null; });

/* ========== はじめ ========== */
if(!API){
  document.getElementById('root').innerHTML = '<main class="content"><div class="login"><h2>このファイルは直接開けません</h2>' +
    '<p style="font-size:14px;line-height:1.8">これはApps Scriptに貼るためのファイルです。サイトは、Apps Scriptで「デプロイ」したときに出る<b>ウェブアプリのURL</b>（https://script.google.com/macros/s/…/exec）から開いてください。</p></div></main>';
  return;
}
if(GUEST){
  render();
  call('guestGet', GUEST).then(function(g){ S.guest = g; render(); }).catch(function(e){ S.guestErr = errMsg(e) || 'このリンクは使えません。'; render(); });
} else if(S.token){ loadBoot(); }
else render();
})();
